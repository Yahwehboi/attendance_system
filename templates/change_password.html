{% extends "base.html" %}
{% block content %}

<div class="mb-6">
    <h1 class="text-3xl font-bold" style="color:#cdd6f4">
        🔑 Change Password
    </h1>
    <p style="color:#6c7086">
        Update your account password
    </p>
</div>

<div class="card rounded-xl p-8 max-w-md">

    <form method="POST"
          action="{{ url_for('change_password') }}">

        <div class="mb-5">
            <label class="text-sm font-semibold block mb-2"
                   style="color:#cdd6f4">
                Current Password
            </label>
            <input type="password"
                   name="current_password"
                   placeholder="Enter current password"
                   required
                   class="w-full p-3 rounded-lg"
                   style="height:48px">
        </div>

        <div class="mb-5">
            <label class="text-sm font-semibold block mb-2"
                   style="color:#cdd6f4">
                New Password
            </label>
            <input type="password"
                   name="new_password"
                   placeholder="Enter new password"
                   required
                   class="w-full p-3 rounded-lg"
                   style="height:48px">
        </div>

        <div class="mb-6">
            <label class="text-sm font-semibold block mb-2"
                   style="color:#cdd6f4">
                Confirm New Password
            </label>
            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm new password"
                   required
                   class="w-full p-3 rounded-lg"
                   style="height:48px">
        </div>

        <div class="flex gap-3">
            <button type="submit" class="btn-primary flex-1"
                    style="height:48px">
                🔑 Change Password
            </button>
            <a href="{{ url_for('dashboard') }}"
               class="btn-primary flex-1 text-center"
               style="background:#44475a; height:48px;
                      line-height:32px">
               Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
